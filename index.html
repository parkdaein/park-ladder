<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 사다리타기</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; padding: 20px; background: #f4f6f9; color: #222; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; margin-top: 0; color: #1a73e8; }
    .box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .pair-header { display: flex; gap: 8px; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #475569; padding-right: 44px; }
    .pair-header span { flex: 1; }
    input, button { padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; }
    input { flex: 1; min-width: 0; background: #fff; }
    input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.15); }
    button { background: #1a73e8; color: #fff; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; white-space: nowrap; }
    button:hover { background: #1557b0; }
    button.secondary { background: #64748b; }
    button.secondary:hover { background: #475569; }
    button.outline { background: #fff; color: #1a73e8; border: 1px solid #1a73e8; }
    button.outline:hover { background: #eff6ff; }
    button.danger { background: #fee2e2; color: #dc2626; padding: 10px 12px; }
    button.danger:hover { background: #fecaca; }
    button:disabled { background: #cbd5e1 !important; color: #fff; border-color: #cbd5e1; cursor: not-allowed; opacity: 0.75; }
    .badge { display: inline-block; padding: 4px 10px; background: #e0f2fe; color: #0369a1; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .online-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .online-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; border-radius: 16px; font-size: 13px; font-weight: 500; }
    .online-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; }
    canvas { width: 100%; height: 420px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; display: block; margin: 16px 0; }
    .player-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
    .results-list { list-style: none; padding: 0; margin: 0; }
    .results-list li { padding: 8px 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>🪜 실시간 사다리타기</h1>

  <!-- 1. 로비 화면 (방 만들기 / 입장하기) -->
  <div id="lobbyView" class="box">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="margin: 0;">새 방 만들기 (방장)</h3>
      <button type="button" id="addPairBtn" class="outline">+ 인원 추가</button>
    </div>

    <div class="row" style="margin-bottom: 14px;">
      <input type="text" id="hostNicknameInput" placeholder="내 닉네임 (접속자 목록 표시용, 예: 방장철수)" />
    </div>

    <div class="pair-header">
      <span>참가자 이름</span>
      <span>벌칙 / 결과 항목</span>
    </div>

    <div id="pairsContainer"></div>

    <button type="button" id="createRoomBtn" style="width: 100%; margin-top: 8px; padding: 12px;">방 생성하고 시작하기</button>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">

    <h3 style="margin-top: 0;">기존 방 입장하기 (참가자)</h3>
    <div class="row">
      <input type="text" id="guestNicknameInput" placeholder="내 닉네임 입력" />
      <input type="text" id="joinRoomIdInput" placeholder="방 코드 6자리" />
      <button type="button" id="joinRoomBtn" class="secondary">입장</button>
    </div>
  </div>

  <!-- 2. 게임 화면 -->
  <div id="gameView" class="hidden">
    <div class="box">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <div>
          <span class="badge">방 코드: <strong id="displayRoomId"></strong></span>
          <span id="roleBadge" class="badge" style="background:#fef3c7; color:#92400e;">참가자</span>
        </div>
        <div>
          <button type="button" id="copyLinkBtn" class="secondary">초대 링크 복사</button>
          <button type="button" id="leaveRoomBtn" class="secondary">나가기</button>
        </div>
      </div>

      <!-- 실시간 접속자 목록 -->
      <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #e2e8f0;">
        <div style="font-size: 13px; font-weight: 600; color: #475569;">
          🟢 현재 접속 중인 참가자 (<span id="onlineCount">0</span>명)
        </div>
        <div id="onlineUsersList" class="online-list"></div>
      </div>
    </div>

    <p id="controlGuideText" style="text-align: center; font-size: 14px; color: #475569; font-weight: 500;"></p>

    <div id="playerButtons" class="player-btns"></div>

    <canvas id="ladderCanvas" width="750" height="420"></canvas>

    <div class="box">
      <h4 style="margin-top:0;">실시간 결과 현황</h4>
      <ul id="resultsList" class="results-list"></ul>
    </div>
  </div>
</div>

<!-- Firebase SDK (Modular v10) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, push, update, onValue, off, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAjOL4GgASs9mxiFx1S1hWNmt0JNNB4-SM",
    authDomain: "park-ladder-game.firebaseapp.com",
    databaseURL: "https://park-ladder-game-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "park-ladder-game",
    storageBucket: "park-ladder-game.firebasestorage.app",
    messagingSenderId: "231503419709",
    appId: "1:231503419709:web:5581543867ab55a71c0d54",
    measurementId: "G-4P3HL75CZR"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 상태 변수
  let currentRoomId = null;
  let roomRef = null;
  let myPresenceRef = null;
  let roomData = null;
  let isAnimating = false;
  let isHost = false;

  const canvas = document.getElementById('ladderCanvas');
  const ctx = canvas.getContext('2d');
  const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];

  // --- 동적 입력칸(참가자 + 벌칙 쌍) 관리 ---
  const pairsContainer = document.getElementById('pairsContainer');

  function addPairRow(playerVal = '', prizeVal = '') {
    const row = document.createElement('div');
    row.className = 'row pair-row';
    row.innerHTML = `
      <input type="text" class="player-input" placeholder="참가자 이름" value="${playerVal}" />
      <input type="text" class="prize-input" placeholder="벌칙 / 결과" value="${prizeVal}" />
      <button type="button" class="danger remove-btn" title="삭제">✕</button>
    `;

    row.querySelector('.remove-btn').addEventListener('click', () => {
      if (pairsContainer.querySelectorAll('.pair-row').length <= 2) {
        alert('최소 2명 이상의 참가자가 필요합니다.');
        return;
      }
      row.remove();
    });

    pairsContainer.appendChild(row);
  }

  addPairRow('철수', '커피쏘기');
  addPairRow('영희', '통과');
  addPairRow('민수', '통과');
  addPairRow('지영', '간식쏘기');

  document.getElementById('addPairBtn').addEventListener('click', () => {
    if (pairsContainer.querySelectorAll('.pair-row').length >= 12) {
      alert('최대 12명까지 추가할 수 있습니다.');
      return;
    }
    addPairRow('', '');
  });

  // URL 파라미터로 방 코드 자동 입장 처리 (닉네임 묻기)
  const urlParams = new URLSearchParams(window.location.search);
  const invitedRoom = urlParams.get('room');
  if (invitedRoom) {
    const code = invitedRoom.toUpperCase();
    document.getElementById('joinRoomIdInput').value = code;
    const savedNick = localStorage.getItem('ladder_nickname') || '';
    const nick = prompt(`방 [${code}]에 입장합니다.\n접속자 목록에 표시될 닉네임을 입력하세요:`, savedNick);
    if (nick && nick.trim()) {
      localStorage.setItem('ladder_nickname', nick.trim());
      joinRoom(code, nick.trim());
    }
  }

  // 방 생성 (방장)
  const createBtn = document.getElementById('createRoomBtn');
  createBtn.addEventListener('click', async () => {
    const rows = document.querySelectorAll('.pair-row');
    const players = [];
    const prizes = [];

    for (let i = 0; i < rows.length; i++) {
      const pName = rows[i].querySelector('.player-input').value.trim();
      const pPrize = rows[i].querySelector('.prize-input').value.trim();

      if (!pName || !pPrize) {
        alert(`${i + 1}번째 줄의 참가자 이름과 벌칙을 모두 입력해 주세요.`);
        return;
      }
      players.push(pName);
      prizes.push(pPrize);
    }

    const hostNick = document.getElementById('hostNicknameInput').value.trim() || `${players[0]}(방장)`;
    localStorage.setItem('ladder_nickname', hostNick);

    const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
    const steps = 12;
    const bridges = generateBridges(players.length, steps);

    const initialData = {
      players,
      prizes,
      steps,
      bridges,
      activeTrace: null,
      completed: {}
    };

    try {
      createBtn.disabled = true;
      createBtn.textContent = '방 생성 중...';
      await set(ref(db, `rooms/${roomId}`), initialData);
      localStorage.setItem(`host_${roomId}`, 'true');
      enterGameView(roomId, hostNick);
    } catch (error) {
      console.error('Firebase 저장 실패:', error);
      alert(`방 생성 실패: ${error.message}\n(Firebase Realtime Database 활성화 및 규칙 설정을 확인하세요.)`);
    } finally {
      createBtn.disabled = false;
      createBtn.textContent = '방 생성하고 시작하기';
    }
  });

  // 방 입장 버튼 (참가자)
  document.getElementById('joinRoomBtn').addEventListener('click', () => {
    const code = document.getElementById('joinRoomIdInput').value.trim().toUpperCase();
    const nick = document.getElementById('guestNicknameInput').value.trim();
    if (!nick) return alert('접속자 목록에 표시할 내 닉네임을 입력하세요.');
    if (!code) return alert('방 코드를 입력하세요.');

    localStorage.setItem('ladder_nickname', nick);
    joinRoom(code, nick);
  });

  async function joinRoom(roomId, nickname) {
    try {
      const snapshot = await get(ref(db, `rooms/${roomId}`));
      if (!snapshot.exists()) {
        alert('존재하지 않는 방 코드입니다.');
        return;
      }
      enterGameView(roomId, nickname);
    } catch (error) {
      alert(`입장 오류: ${error.message}`);
    }
  }

  // 게임 화면 진입 및 Firebase 실시간 리스너 + 접속자(Presence) 등록
  function enterGameView(roomId, nickname) {
    currentRoomId = roomId;
    isHost = localStorage.getItem(`host_${roomId}`) === 'true';

    window.history.replaceState({}, '', `?room=${roomId}`);
    document.getElementById('lobbyView').classList.add('hidden');
    document.getElementById('gameView').classList.remove('hidden');
    document.getElementById('displayRoomId').textContent = roomId;

    const roleBadge = document.getElementById('roleBadge');
    roleBadge.textContent = isHost ? '👑 방장' : '👀 참가자';
    roleBadge.style.background = isHost ? '#fef3c7' : '#f1f5f9';
    roleBadge.style.color = isHost ? '#92400e' : '#475569';

    document.getElementById('controlGuideText').innerHTML = isHost
      ? '👑 당신은 <strong>방장</strong>입니다. 아래 버튼을 눌러 사다리를 출발시키세요!'
      : '👀 <strong>방장</strong>만 사다리 출발 버튼을 누를 수 있습니다. 화면에서 실시간 결과를 확인하세요!';

    // 실시간 접속자 등록 (창 닫기/새로고침 시 자동 삭제)
    const onlineListRef = ref(db, `rooms/${roomId}/onlineUsers`);
    myPresenceRef = push(onlineListRef);
    set(myPresenceRef, {
      name: nickname,
      isHost: isHost,
      joinedAt: Date.now()
    });
    onDisconnect(myPresenceRef).remove();

    // 방 전체 데이터 실시간 감지
    roomRef = ref(db, `rooms/${roomId}`);
    onValue(roomRef, (snapshot) => {
      if (!snapshot.exists()) return;
      const newData = snapshot.val();
      const prevTraceTime = roomData?.activeTrace?.timestamp;
      roomData = newData;

      renderOnlineUsers(newData.onlineUsers || {});
      renderControls();
      renderResults();

      if (newData.activeTrace && newData.activeTrace.timestamp !== prevTraceTime) {
        animateLadder(newData.activeTrace.playerIndex);
      } else if (!isAnimating) {
        drawBaseLadder();
      }
    });
  }

  // 현재 접속자 목록 렌더링
  function renderOnlineUsers(onlineUsersObj) {
    const container = document.getElementById('onlineUsersList');
    const countSpan = document.getElementById('onlineCount');
    container.innerHTML = '';

    const users = Object.values(onlineUsersObj);
    countSpan.textContent = users.length;

    users.forEach(user => {
      const chip = document.createElement('span');
      chip.className = 'online-chip';
      chip.innerHTML = `<span class="online-dot"></span> ${user.isHost ? '👑 ' : ''}${escapeHtml(user.name)}`;
      container.appendChild(chip);
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  // 가로줄 무작위 생성
  function generateBridges(cols, steps) {
    const bridges = [];
    for (let r = 0; r < steps; r++) {
      const row = new Array(cols - 1).fill(false);
      for (let c = 0; c < cols - 1; c++) {
        if (c > 0 && row[c - 1]) continue;
        row[c] = Math.random() < 0.45;
      }
      bridges.push(row);
    }
    return bridges;
  }

  // 상단 참가자 출발 버튼 렌더링 (방장만 클릭 가능)
  function renderControls() {
    const container = document.getElementById('playerButtons');
    container.innerHTML = '';
    roomData.players.forEach((name, idx) => {
      const btn = document.createElement('button');
      const isDone = roomData.completed && roomData.completed[idx] !== undefined;

      if (isHost) {
        btn.textContent = isDone ? `${name} (완료)` : `${name} 출발`;
        btn.disabled = isAnimating;
        btn.onclick = () => triggerTrace(idx);
      } else {
        btn.textContent = isDone ? `${name} (완료)` : `${name} (대기)`;
        btn.disabled = true; // 일반 참가자는 비활성화
      }

      btn.style.background = isDone ? '#94a3b8' : COLORS[idx % COLORS.length];
      container.appendChild(btn);
    });
  }

  // Firebase에 사다리 타기 시작 신호 전송 (방장 전용)
  async function triggerTrace(playerIndex) {
    if (!isHost || isAnimating) return;
    await update(roomRef, {
      activeTrace: { playerIndex, timestamp: Date.now() }
    });
  }

  // 기본 사다리 그리기
  function drawBaseLadder() {
    if (!roomData) return;
    const { players, prizes, steps, bridges } = roomData;
    const cols = players.length;
    const padX = 60, padY = 50;
    const w = canvas.width - padX * 2;
    const h = canvas.height - padY * 2;
    const colGap = w / (cols - 1);
    const rowGap = h / (steps + 1);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = 'round';

    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    for (let c = 0; c < cols; c++) {
      const x = padX + c * colGap;
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x, padY);
      ctx.lineTo(x, padY + h);
      ctx.stroke();

      ctx.fillStyle = COLORS[c % COLORS.length];
      ctx.fillText(players[c], x, padY - 18);

      ctx.fillStyle = '#1e293b';
      ctx.fillText(prizes[c], x, padY + h + 28);
    }

    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 4;
    for (let r = 0; r < steps; r++) {
      const y = padY + (r + 1) * rowGap;
      for (let c = 0; c < cols - 1; c++) {
        if (bridges[r][c]) {
          const x1 = padX + c * colGap;
          const x2 = padX + (c + 1) * colGap;
          ctx.beginPath();
          ctx.moveTo(x1, y);
          ctx.lineTo(x2, y);
          ctx.stroke();
        }
      }
    }
  }

  // 경로 계산 및 애니메이션
  function animateLadder(playerIdx) {
    isAnimating = true;
    renderControls();

    const { players, steps, bridges } = roomData;
    const cols = players.length;
    const padX = 60, padY = 50;
    const colGap = (canvas.width - padX * 2) / (cols - 1);
    const rowGap = (canvas.height - padY * 2) / (steps + 1);

    let currCol = playerIdx;
    const points = [{ x: padX + currCol * colGap, y: padY }];

    for (let r = 0; r < steps; r++) {
      const y = padY + (r + 1) * rowGap;
      points.push({ x: padX + currCol * colGap, y });

      if (currCol < cols - 1 && bridges[r][currCol]) {
        currCol++;
        points.push({ x: padX + currCol * colGap, y });
      } else if (currCol > 0 && bridges[r][currCol - 1]) {
        currCol--;
        points.push({ x: padX + currCol * colGap, y });
      }
    }
    points.push({ x: padX + currCol * colGap, y: padY + (canvas.height - padY * 2) });
    const finalPrizeIdx = currCol;

    let seg = 0;
    let progress = 0;
    const speed = 0.08;

    function step() {
      drawBaseLadder();
      ctx.strokeStyle = COLORS[playerIdx % COLORS.length];
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);

      for (let i = 0; i < seg; i++) {
        ctx.lineTo(points[i + 1].x, points[i + 1].y);
      }

      if (seg < points.length - 1) {
        const p1 = points[seg];
        const p2 = points[seg + 1];
        const curX = p1.x + (p2.x - p1.x) * progress;
        const curY = p1.y + (p2.y - p1.y) * progress;
        ctx.lineTo(curX, curY);
        ctx.stroke();

        ctx.fillStyle = COLORS[playerIdx % COLORS.length];
        ctx.beginPath();
        ctx.arc(curX, curY, 8, 0, Math.PI * 2);
        ctx.fill();

        progress += speed;
        if (progress >= 1) {
          progress = 0;
          seg++;
        }
        requestAnimationFrame(step);
      } else {
        ctx.stroke();
        isAnimating = false;
        // 방장만 완료 결과 DB에 기록 (중복 쓰기 방지)
        if (isHost) {
          update(ref(db, `rooms/${currentRoomId}/completed`), {
            [playerIdx]: finalPrizeIdx
          });
        }
        renderControls();
      }
    }
    requestAnimationFrame(step);
  }

  // 결과 목록 렌더링
  function renderResults() {
    const list = document.getElementById('resultsList');
    list.innerHTML = '';
    const completed = roomData.completed || {};
    roomData.players.forEach((player, idx) => {
      const li = document.createElement('li');
      const prizeIdx = completed[idx];
      li.innerHTML = `
        <strong>${escapeHtml(player)}</strong>
        <span>${prizeIdx !== undefined ? `🎯 <b>${escapeHtml(roomData.prizes[prizeIdx])}</b>` : '대기 중...'}</span>
      `;
      list.appendChild(li);
    });
  }

  // 초대 링크 복사 & 나가기
  document.getElementById('copyLinkBtn').onclick = () => {
    navigator.clipboard.writeText(window.location.href);
    alert('초대 링크가 복사되었습니다! 친구들에게 공유하세요.');
  };

  document.getElementById('leaveRoomBtn').onclick = async () => {
    if (myPresenceRef) await remove(myPresenceRef);
    if (roomRef) off(roomRef);
    window.history.replaceState({}, '', window.location.pathname);
    location.reload();
  };
</script>
</body>
</html>
