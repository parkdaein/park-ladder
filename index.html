<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 사다리타기</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; padding: 20px; background: #f4f6f9; color: #222; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { text-align: center; margin-top: 0; color: #1a73e8; }
    .box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    input, button { padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; }
    input { flex: 1; min-width: 120px; }
    button { background: #1a73e8; color: #fff; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
    button:hover { background: #1557b0; }
    button.secondary { background: #64748b; }
    button.secondary:hover { background: #475569; }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }
    .badge { display: inline-block; padding: 4px 10px; background: #e0f2fe; color: #0369a1; border-radius: 20px; font-size: 13px; font-weight: 600; }
    canvas { width: 100%; height: 420px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; display: block; margin: 16px 0; }
    .player-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
    .results-list { list-style: none; padding: 0; margin: 0; }
    .results-list li { padding: 8px 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>🪜 실시간 사다리타기</h1>

  <!-- 1. 로비 화면 (방 만들기 / 입장하기) -->
  <div id="lobbyView" class="box">
    <h3>새 방 만들기</h3>
    <div class="row">
      <input type="text" id="playersInput" placeholder="참가자 이름 (쉼표로 구분 예: 철수,영희,민수)" value="철수,영희,민수,지영" />
    </div>
    <div class="row">
      <input type="text" id="prizesInput" placeholder="결과 항목 (인원수와 동일하게 예: 당첨,꽝,꽝,커피)" value="커피쏘기,통과,통과,간식쏘기" />
    </div>
    <button id="createRoomBtn" style="width: 100%;">방 생성하고 시작하기</button>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">

    <h3>기존 방 입장하기</h3>
    <div class="row">
      <input type="text" id="joinRoomIdInput" placeholder="방 코드 6자리 입력" />
      <button id="joinRoomBtn" class="secondary">입장</button>
    </div>
  </div>

  <!-- 2. 게임 화면 -->
  <div id="gameView" class="hidden">
    <div class="box" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
      <div>
        <span class="badge">방 코드: <strong id="displayRoomId"></strong></span>
        <span id="roleBadge" class="badge" style="background:#fef3c7; color:#92400e;">참가자</span>
      </div>
      <div>
        <button id="copyLinkBtn" class="secondary">초대 링크 복사</button>
        <button id="leaveRoomBtn" class="secondary">나가기</button>
      </div>
    </div>

    <p style="text-align: center; font-size: 14px; color: #475569;">
      아래 <strong>참가자 버튼</strong>을 누르면 모든 접속자의 화면에서 동시에 사다리가 내려갑니다!
    </p>

    <div id="playerButtons" class="player-btns"></div>

    <canvas id="ladderCanvas" width="750" height="420"></canvas>

    <div class="box">
      <h4 style="margin-top:0;">실시간 결과 현황</h4>
      <ul id="resultsList" class="results-list"></ul>
    </div>
  </div>
</div>

<!-- Firebase SDK (Modular v10) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, update, onValue, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAjOL4GgASs9mxiFx1S1hWNmt0JNNB4-SM",
    authDomain: "park-ladder-game.firebaseapp.com",
    databaseURL: "https://park-ladder-game-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "park-ladder-game",
    storageBucket: "park-ladder-game.firebasestorage.app",
    messagingSenderId: "231503419709",
    appId: "1:231503419709:web:5581543867ab55a71c0d54",
    measurementId: "G-4P3HL75CZR"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 상태 변수
  let currentRoomId = null;
  let roomRef = null;
  let roomData = null;
  let isAnimating = false;
  let currentAnimIndex = -1;

  const canvas = document.getElementById('ladderCanvas');
  const ctx = canvas.getContext('2d');
  const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];

  // URL 파라미터로 방 코드 자동 입장 확인
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('room')) {
    joinRoom(urlParams.get('room').toUpperCase());
  }

  // 방 생성
  document.getElementById('createRoomBtn').addEventListener('click', async () => {
    const players = document.getElementById('playersInput').value.split(',').map(s => s.trim()).filter(Boolean);
    const prizes = document.getElementById('prizesInput').value.split(',').map(s => s.trim()).filter(Boolean);

    if (players.length < 2) return alert('참가자는 최소 2명 이상이어야 합니다.');
    if (players.length !== prizes.length) return alert(`참가자 수(${players.length}명)와 결과 항목 수(${prizes.length}개)가 일치해야 합니다.`);

    const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
    const steps = 12; // 가로줄 층수
    const bridges = generateBridges(players.length, steps);

    const initialData = {
      players,
      prizes,
      steps,
      bridges,
      activeTrace: null, // { playerIndex, timestamp }
      completed: {}      // { playerIndex: prizeIndex }
    };

    await set(ref(db, `rooms/${roomId}`), initialData);
    localStorage.setItem(`host_${roomId}`, 'true');
    enterGameView(roomId);
  });

  // 방 입장 버튼
  document.getElementById('joinRoomBtn').addEventListener('click', () => {
    const code = document.getElementById('joinRoomIdInput').value.trim().toUpperCase();
    if (!code) return alert('방 코드를 입력하세요.');
    joinRoom(code);
  });

  async function joinRoom(roomId) {
    const snapshot = await get(ref(db, `rooms/${roomId}`));
    if (!snapshot.exists()) {
      alert('존재하지 않는 방 코드입니다.');
      return;
    }
    enterGameView(roomId);
  }

  // 게임 화면 진입 및 Firebase 실시간 리스너 연결
  function enterGameView(roomId) {
    currentRoomId = roomId;
    window.history.replaceState({}, '', `?room=${roomId}`);
    document.getElementById('lobbyView').classList.add('hidden');
    document.getElementById('gameView').classList.remove('hidden');
    document.getElementById('displayRoomId').textContent = roomId;
    document.getElementById('roleBadge').textContent = localStorage.getItem(`host_${roomId}`) ? '방장' : '참가자';

    roomRef = ref(db, `rooms/${roomId}`);
    onValue(roomRef, (snapshot) => {
      if (!snapshot.exists()) return;
      const newData = snapshot.val();
      const prevTraceTime = roomData?.activeTrace?.timestamp;
      roomData = newData;

      renderControls();
      renderResults();

      // 새로운 사다리 타기 이벤트가 감지되면 애니메이션 실행
      if (newData.activeTrace && newData.activeTrace.timestamp !== prevTraceTime) {
        animateLadder(newData.activeTrace.playerIndex);
      } else if (!isAnimating) {
        drawBaseLadder();
      }
    });
  }

  // 가로줄 무작위 생성 (인접한 줄끼리 겹치지 않게)
  function generateBridges(cols, steps) {
    const bridges = [];
    for (let r = 0; r < steps; r++) {
      const row = new Array(cols - 1).fill(false);
      for (let c = 0; c < cols - 1; c++) {
        if (c > 0 && row[c - 1]) continue; // 바로 왼쪽에 다리가 있으면 패스
        row[c] = Math.random() < 0.45;
      }
      bridges.push(row);
    }
    return bridges;
  }

  // 상단 참가자 버튼 렌더링
  function renderControls() {
    const container = document.getElementById('playerButtons');
    container.innerHTML = '';
    roomData.players.forEach((name, idx) => {
      const btn = document.createElement('button');
      const isDone = roomData.completed && roomData.completed[idx] !== undefined;
      btn.textContent = isDone ? `${name} (완료)` : `${name} 출발`;
      btn.style.background = isDone ? '#94a3b8' : COLORS[idx % COLORS.length];
      btn.disabled = isAnimating;
      btn.onclick = () => triggerTrace(idx);
      container.appendChild(btn);
    });
  }

  // Firebase에 사다리 타기 시작 신호 전송
  async function triggerTrace(playerIndex) {
    if (isAnimating) return;
    await update(roomRef, {
      activeTrace: { playerIndex, timestamp: Date.now() }
    });
  }

  // 기본 사다리 그리기
  function drawBaseLadder() {
    if (!roomData) return;
    const { players, prizes, steps, bridges } = roomData;
    const cols = players.length;
    const padX = 60, padY = 50;
    const w = canvas.width - padX * 2;
    const h = canvas.height - padY * 2;
    const colGap = w / (cols - 1);
    const rowGap = h / (steps + 1);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineCap = 'round';

    // 세로선 및 이름/결과 텍스트
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    for (let c = 0; c < cols; c++) {
      const x = padX + c * colGap;
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x, padY);
      ctx.lineTo(x, padY + h);
      ctx.stroke();

      ctx.fillStyle = COLORS[c % COLORS.length];
      ctx.fillText(players[c], x, padY - 18);

      ctx.fillStyle = '#1e293b';
      ctx.fillText(prizes[c], x, padY + h + 28);
    }

    // 가로선
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 4;
    for (let r = 0; r < steps; r++) {
      const y = padY + (r + 1) * rowGap;
      for (let c = 0; c < cols - 1; c++) {
        if (bridges[r][c]) {
          const x1 = padX + c * colGap;
          const x2 = padX + (c + 1) * colGap;
          ctx.beginPath();
          ctx.moveTo(x1, y);
          ctx.lineTo(x2, y);
          ctx.stroke();
        }
      }
    }
  }

  // 경로 계산 및 애니메이션
  function animateLadder(playerIdx) {
    isAnimating = true;
    renderControls();

    const { players, steps, bridges } = roomData;
    const cols = players.length;
    const padX = 60, padY = 50;
    const colGap = (canvas.width - padX * 2) / (cols - 1);
    const rowGap = (canvas.height - padY * 2) / (steps + 1);

    // 경로 좌표 배열 생성
    let currCol = playerIdx;
    const points = [{ x: padX + currCol * colGap, y: padY }];

    for (let r = 0; r < steps; r++) {
      const y = padY + (r + 1) * rowGap;
      points.push({ x: padX + currCol * colGap, y });

      if (currCol < cols - 1 && bridges[r][currCol]) {
        currCol++;
        points.push({ x: padX + currCol * colGap, y });
      } else if (currCol > 0 && bridges[r][currCol - 1]) {
        currCol--;
        points.push({ x: padX + currCol * colGap, y });
      }
    }
    points.push({ x: padX + currCol * colGap, y: padY + (canvas.height - padY * 2) });
    const finalPrizeIdx = currCol;

    // 프레임 애니메이션 실행
    let seg = 0;
    let progress = 0;
    const speed = 0.08;

    function step() {
      drawBaseLadder();
      ctx.strokeStyle = COLORS[playerIdx % COLORS.length];
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);

      for (let i = 0; i < seg; i++) {
        ctx.lineTo(points[i + 1].x, points[i + 1].y);
      }

      if (seg < points.length - 1) {
        const p1 = points[seg];
        const p2 = points[seg + 1];
        const curX = p1.x + (p2.x - p1.x) * progress;
        const curY = p1.y + (p2.y - p1.y) * progress;
        ctx.lineTo(curX, curY);
        ctx.stroke();

        // 현재 위치 점 표시
        ctx.fillStyle = COLORS[playerIdx % COLORS.length];
        ctx.beginPath();
        ctx.arc(curX, curY, 8, 0, Math.PI * 2);
        ctx.fill();

        progress += speed;
        if (progress >= 1) {
          progress = 0;
          seg++;
        }
        requestAnimationFrame(step);
      } else {
        ctx.stroke();
        isAnimating = false;
        // 결과 저장
        update(ref(db, `rooms/${currentRoomId}/completed`), {
          [playerIdx]: finalPrizeIdx
        });
        renderControls();
      }
    }
    requestAnimationFrame(step);
  }

  // 결과 목록 렌더링
  function renderResults() {
    const list = document.getElementById('resultsList');
    list.innerHTML = '';
    const completed = roomData.completed || {};
    roomData.players.forEach((player, idx) => {
      const li = document.createElement('li');
      const prizeIdx = completed[idx];
      li.innerHTML = `
        <strong>${player}</strong>
        <span>${prizeIdx !== undefined ? `🎯 <b>${roomData.prizes[prizeIdx]}</b>` : '대기 중...'}</span>
      `;
      list.appendChild(li);
    });
  }

  // 초대 링크 복사 & 나가기
  document.getElementById('copyLinkBtn').onclick = () => {
    navigator.clipboard.writeText(window.location.href);
    alert('초대 링크가 복사되었습니다! 친구들에게 공유하세요.');
  };

  document.getElementById('leaveRoomBtn').onclick = () => {
    if (roomRef) off(roomRef);
    window.history.replaceState({}, '', window.location.pathname);
    location.reload();
  };
</script>
</body>
</html>
